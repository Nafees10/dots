################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=eDP-1, preferred, 0x0, 1.25
#monitor=DP-1, preferred, 0x0, 1, transform, 1
#monitor=HDMI-A-1, preferred, 0x1080, 1.0

#monitor=HDMI-A-1, preferred, 2000x0, 1.0 # HDMI extend
#monitor=HDMI-A-1, preferred, auto, 1, mirror, eDP-1 # HDMI mirror
monitor=HDMI-A-1, preferred, -1500x0, 1, transform, 1 # HDMI vertical

misc{
	disable_hyprland_logo = true
	mouse_move_enables_dpms = true
	key_press_enables_dpms = true
	vfr = 1
	enable_anr_dialog = false
}

ecosystem{
	no_update_news = true
}

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &

exec-once = swayidle -w timeout 10 'if pgrep -x swaylock; then hyprctl dispatch dpms off; fi' resume 'swaymsg "output * power on"' before-sleep 'swaylock -f -c 282A36'
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#####################
### LOOK AND FEEL ###
#####################

general {
	gaps_in = 0
	gaps_out = 0
	border_size = 1
	resize_on_border = false
	allow_tearing = false
	layout = dwindle

	col.active_border = rgba(81a1c1ff)
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
	rounding = 0
	active_opacity = 1.0
	inactive_opacity = 1.0
	shadow {
		enabled = false
	}
	blur {
		enabled = false
		size = 3
		passes = 1
		vibrancy = 0.1696
	}
}

workspace = w[tv1], border:false
workspace = w[tv2-99], border:true

workspace=2, monitor:eDP-1
workspace=3, monitor:eDP-1
workspace=4, monitor:eDP-1
workspace=6, monitor:eDP-1
workspace=7, monitor:eDP-1
workspace=8, monitor:eDP-1
workspace=10, monitor:eDP-1
workspace=11, monitor:eDP-1
workspace=12, monitor:eDP-1

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
	enabled = no
}

dwindle {
	pseudotile = true
	preserve_split = true
	force_split = 2
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
	new_status = master
	orientation = right
}

device {
	name = at-translated-set-2-keyboard-1
	kb_layout = us
}

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
	kb_layout = us
	kb_variant =
	kb_model =
	kb_options =
	kb_rules =

	follow_mouse = 1

	sensitivity = 1 # -1.0 - 1.0, 0 means no modification.
	accel_profile = flat

	touchpad {
		natural_scroll = true
		disable_while_typing = false
		scroll_factor = 0.5
	}
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
	workspace_swipe = false
}


####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

bind = ALT, Tab, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%

bind = ALT, P, exec, grim -o $(hyprctl monitors -j | jq -r '.[] | select(.focused).name') - | wl-copy
#bind = ALT, P, exec, grimblast copy output
bind = ALT+Shift, p, exec, slurp | grim -g - - | wl-copy
#bind = ALT+Shift, P, exec, grimblast --freeze copy area

bindm = SUPER, mouse:272, movewindow

bind = SUPER, t, exec, alacritty
bind = SUPER, g, exec, firefox --new-window
bind = SUPER+SHIFT, g, exec, firefox --private-window
bind = SUPER, b, exec, Thunar

bind = ALT, 2, togglefloating
bind = ALT, 3, fullscreen
bind = Alt, 4, killactive

#bind = Ctrl, ESCAPE, exec, rofi -modi drun,run -show drun
bind = Ctrl, ESCAPE, exec, kickoff --history /dev/null

bind = ALT, h, movefocus, l
bind = ALT, j, movefocus, d
bind = ALT, k, movefocus, u
bind = ALT, l, movefocus, r

bind = SUPER, h, movewindow, l
bind = SUPER, j, movewindow, d
bind = SUPER, k, movewindow, u
bind = SUPER, l, movewindow, r

bind = SUPER, o, exec, swaylock -c 282A36

bind = SUPER SHIFT, h, resizeactive, -25 0
bind = SUPER SHIFT, j, resizeactive, 0 25
bind = SUPER SHIFT, k, resizeactive, 0 -25
bind = SUPER SHIFT, l, resizeactive, 25 0

bind = ALT, q, workspace, 1
bind = ALT, w, workspace, 2
bind = ALT, e, workspace, 3
bind = ALT, r, workspace, 4
bind = ALT, a, workspace, 5
bind = ALT, s, workspace, 6
bind = ALT, d, workspace, 7
bind = ALT, f, workspace, 8
bind = ALT, z, workspace, 9
bind = ALT, x, workspace, 10
bind = ALT, c, workspace, 11
bind = ALT, v, workspace, 12

bind = SUPER, q, movetoworkspace, 1
bind = SUPER, w, movetoworkspace, 2
bind = SUPER, e, movetoworkspace, 3
bind = SUPER, r, movetoworkspace, 4
bind = SUPER, a, movetoworkspace, 5
bind = SUPER, s, movetoworkspace, 6
bind = SUPER, d, movetoworkspace, 7
bind = SUPER, f, movetoworkspace, 8
bind = SUPER, z, movetoworkspace, 9
bind = SUPER, x, movetoworkspace, 10
bind = SUPER, c, movetoworkspace, 11
bind = SUPER, v, movetoworkspace, 12

# Example special workspace (scratchpad)
bind = ALT, 1, togglespecialworkspace, magic
bind = SUPER, 1, movetoworkspace, special:magic

bind = SUPER, m, movecurrentworkspacetomonitor, +1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = ALT, mouse:272, movewindow
bindm = ALT, mouse:273, resizewindow

# TODO check this
windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

xwayland {
	force_zero_scaling = true
}
